site_name: FSang18's Heroes Addon Wiki - Argon
site_description: Documentation for Argon, the Palladium library behind FSang18's Heroes - abilities, conditions, values, actions, effects and systems.
site_url: !ENV [SITE_URL, ""]
repo_url: !ENV [REPO_URL, ""]
edit_uri: !ENV [EDIT_URI, ""]
copyright: >-
  This wiki covers Argon, the library used by the Heroes Addon 26.1 Test version (unreleased) for Minecraft 26.1<br>
  <a href="https://www.curseforge.com/minecraft/mc-mods/fsang18s-heropack">CurseForge</a> ·
  <a href="https://modrinth.com/datapack/fsang18s-heropack">Modrinth</a> ·
  <a href="https://discord.com/invite/BThgxXpBVs">Discord</a>

extra:
  generator: false
  version:
    provider: mike

theme:
  name: material
  logo: uploads/2703a3f0b163b13baac62a9fe5115772/logo_big.png
  favicon: uploads/2703a3f0b163b13baac62a9fe5115772/logo_big.png
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.prune
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy
    - content.tabs.link

extra_css:
  - stylesheets/extra.css
  - stylesheets/power-pages.css
  - stylesheets/argon.css

extra_javascript:
  - javascripts/move-version.js
  - javascripts/copy-id.js

plugins:
  - search

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - admonition
  - nl2br
  - toc:
      permalink: false
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - mdx_truly_sane_lists:
      nested_indent: 2
      truly_sane: true

validation:
  links:
    not_found: warn
    absolute_links: ignore
    unrecognized_links: ignore
