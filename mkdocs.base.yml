site_name: FSang18's Heroes Addon Wiki
site_description: The official wiki for FSang18's Heroes Addon - powers, suitsets, items, blocks, structures, commands and more.
site_url: !ENV [SITE_URL, ""]
repo_url: !ENV [REPO_URL, ""]
edit_uri: !ENV [EDIT_URI, ""]
copyright: FSang18's Heroes Addon Wiki - fan documentation, maintained by Werkiax

theme:
  name: material
  logo: uploads/2703a3f0b163b13baac62a9fe5115772/logo_big.png
  favicon: uploads/2703a3f0b163b13baac62a9fe5115772/logo_big.png
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.prune
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - toc.follow

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - admonition
  - nl2br
  - toc:
      permalink: false
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - mdx_truly_sane_lists:
      nested_indent: 2
      truly_sane: true

validation:
  links:
    not_found: warn
    absolute_links: ignore
    unrecognized_links: ignore
