name: Publish wiki

# Runs every time something is changed on the "main" branch (an edit made on github.com counts),
# builds the website and publishes it to GitHub Pages. Nothing to configure.
on:
  push:
    branches: [main]
  workflow_dispatch:      # also lets you press "Run workflow" by hand

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build the menu from the files
        run: python tools/make_nav.py
      - name: Build the website
        run: mkdocs build
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          REPO_URL: https://github.com/${{ github.repository }}
          EDIT_URI: edit/main/docs/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
